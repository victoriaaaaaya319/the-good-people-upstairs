<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樓上的好人｜線上節目單</title>
<meta name="description" content="阮劇團《樓上的好人》線上節目手冊">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="樓上的好人｜線上節目單">
<meta property="og:description" content="阮劇團《樓上的好人》線上節目手冊">
<meta property="og:image" content="pages/01.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }

  /* 每一頁佔滿整個畫面，滑動時一次吸附一頁 */
  #book {
    height: 100vh; height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #book::-webkit-scrollbar { display: none; }
  .page {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center;
  }
  .page img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    display: block;
    -webkit-user-drag: none; user-select: none;
  }

  #counter {
    position: fixed; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    padding: 4px 10px; border-radius: 999px;
    background: rgba(0, 0, 0, .45); color: #fff;
    font: 12px/1.4 system-ui, sans-serif; letter-spacing: .05em;
    pointer-events: none;
  }

  /* 開啟時的操作引導：半透明黑色遮罩＋上下滑動 icon */
  #guide {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: rgba(0, 0, 0, .65); color: #fff;
    font: 16px/1.6 system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    letter-spacing: .15em; text-align: center;
    touch-action: none; cursor: pointer; /* 引導期間先擋住翻頁：點一下或滑一下進到下一段 */
    -webkit-tap-highlight-color: transparent; user-select: none;
    transition: opacity .4s ease;
  }
  #guide.hide { opacity: 0; pointer-events: none; }
  #guide svg { width: 96px; height: 144px; overflow: visible; }
  #guide .step { display: none; flex-direction: column; align-items: center; gap: 20px; padding: 0 24px; animation: fadein .4s ease; }
  #guide .step.on { display: flex; }
  #guide .title { font-size: 18px; font-weight: 600; }
  #guide .sub { font-size: 14px; letter-spacing: .08em; opacity: .85; margin-top: -12px; }
  #guide .dots { display: flex; gap: 8px; margin-top: 8px; }
  #guide .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .3; transition: opacity .3s; }
  #guide .dots i.on { opacity: 1; }
  #guide .press { animation: press 1.8s ease-in-out infinite; transform-origin: 48px 72px; }
  #guide .ring  { animation: ring 1.8s ease-out infinite; transform-origin: 48px 44px; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes press {
    0%, 100% { transform: scale(1); }
    30%, 70% { transform: scale(.92); }
  }
  @keyframes ring {
    0%, 20%  { transform: scale(.4); opacity: 0; }
    35%      { opacity: .9; }
    80%, 100% { transform: scale(1.5); opacity: 0; }
  }
  #guide .hand { animation: swipe 1.8s ease-in-out infinite; }
  #guide .up   { animation: blink 1.8s ease-in-out infinite; }
  #guide .down { animation: blink 1.8s ease-in-out infinite .9s; }
  @keyframes swipe {
    0%, 100% { transform: translateY(14px); }
    50%      { transform: translateY(-14px); }
  }
  @keyframes blink {
    0%, 100% { opacity: .25; }
    50%      { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #guide .hand, #guide .up, #guide .down, #guide .press { animation: none; opacity: 1; }
    #guide .ring { animation: none; opacity: .6; }
  }
</style>
</head>
<body>

<main id="book" tabindex="0" aria-label="樓上的好人 線上節目單"></main>
<div id="counter" aria-live="polite"></div>

<div id="guide" role="status">
 <div class="step on">
  <svgviewBox="0 0 96 144" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="up" d="M34 18 48 4l14 14"/>
    <path class="down" d="M34 126l14 14 14-14"/>
    <g class="hand">
      <!-- 食指 -->
      <path d="M41 78V48a7 7 0 0 1 14 0v24"/>
      <!-- 其餘手指與手掌 -->
      <path d="M55 72v-6a6 6 0 0 1 12 0v8"/>
      <path d="M67 74v-3a6 6 0 0 1 12 0v17c0 14-9 22-21 22h-4c-8 0-13-3-18-10L25 88a6 6 0 0 1 9-8l7 7"/>
    </g>
  </svg>
  <div class="title">上下滑動翻頁</div>
 </div>
 <div class="step">
  <svg viewBox="0 0 96 144" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <!-- 長按的波紋 -->
    <circle class="ring" cx="48" cy="44" r="18"/>
    <g class="press">
      <path d="M41 78V48a7 7 0 0 1 14 0v24"/>
      <path d="M55 72v-6a6 6 0 0 1 12 0v8"/>
      <path d="M67 74v-3a6 6 0 0 1 12 0v17c0 14-9 22-21 22h-4c-8 0-13-3-18-10L25 88a6 6 0 0 1 9-8l7 7"/>
    </g>
    <!-- 下載 -->
    <path d="M48 118v16m-7-7 7 7 7-7M34 142h28"/>
  </svg>
  <div class="title">長按可下載圖片</div>
  <div class="sub">歡迎發到限動分享，記得 @our_theatre</div>
 </div>
 <div class="dots" aria-hidden="true"><i class="on"></i><i></i></div>
</div>

<script>
  const TOTAL = 20;
  const book = document.getElementById('book');
  const counter = document.getElementById('counter');
  const guide = document.getElementById('guide');

  for (let i = 1; i <= TOTAL; i++) {
    const n = String(i).padStart(2, '0');
    const sec = document.createElement('section');
    sec.className = 'page';
    const img = new Image(1200, 2134);
    img.alt = `第 ${i} 頁`;
    img.decoding = 'async';
    if (i > 2) img.loading = 'lazy';
    img.src = `pages/${n}.jpg`;
    sec.appendChild(img);
    book.appendChild(sec);
  }

  const current = () => Math.round(book.scrollTop / book.clientHeight);
  const goTo = (i) => book.scrollTo({ top: Math.max(0, Math.min(TOTAL - 1, i)) * book.clientHeight, behavior: 'smooth' });
  const updateCounter = () => { counter.textContent = `${current() + 1} / ${TOTAL}`; };
  book.addEventListener('scroll', updateCounter, { passive: true });
  updateCounter();

  // 開場引導共兩段：點一下、滑一下、滾輪或按鍵都會進到下一段，最後一段結束才能翻頁
  const steps = [...guide.querySelectorAll('.step')];
  const dots = [...guide.querySelectorAll('.dots i')];
  let step = 0, guideOpen = true, guideLock = false;
  const advanceGuide = () => {
    if (!guideOpen || guideLock) return;
    guideLock = true;
    setTimeout(() => { guideLock = false; }, 500);
    if (++step < steps.length) {
      steps.forEach((s, i) => s.classList.toggle('on', i === step));
      dots.forEach((d, i) => d.classList.toggle('on', i === step));
    } else {
      guideOpen = false;
      guide.classList.add('hide');
      setTimeout(() => guide.remove(), 500);
    }
  };
  guide.addEventListener('pointerup', advanceGuide);
  guide.addEventListener('wheel', advanceGuide, { passive: true });

  // 滑鼠滾輪／觸控板：滾一下就翻一頁（手機觸控滑動交給 scroll-snap 處理）
  let wheelLock = false;
  book.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (wheelLock || Math.abs(e.deltaY) < 4) return;
    wheelLock = true;
    goTo(current() + (e.deltaY > 0 ? 1 : -1));
    setTimeout(() => { wheelLock = false; }, 700);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (guideOpen) { e.preventDefault(); advanceGuide(); return; }
    if(['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goTo(current() + 1); }
    else if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); goTo(current() - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(TOTAL - 1); }
  });
</script>
</body>
</html>
